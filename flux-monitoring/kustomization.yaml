  name: monitoring-stack
  namespace: flux-system
spec:
  interval: 1m0s
  path: "./../otel/k8s"
  prune: true
  sourceRef:
    kind: GitRepository
    name: monitoring-repo
    namespace: flux-system
  targetNamespace: monitoring
